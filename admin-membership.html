<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IronForge | Membership Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: #fff;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 75px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #292929;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #ff4d00;
            letter-spacing: 1px;
        }

        .admin-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-badge {
            background: #242424;
            border: 1px solid #333;
            padding: 8px 13px;
            border-radius: 6px;
            color: #ff4d00;
            font-size: 13px;
        }

        .logout-btn {
            border: none;
            background: #ff4d00;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #ff6a2a;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 35px auto;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            margin-bottom: 25px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #888;
            font-size: 14px;
        }

        /* =========================
           CREATE BUTTON
        ========================= */

        .create-btn {
            border: none;
            background: #ff4d00;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .create-btn:hover {
            background: #ff6a2a;
            transform: translateY(-1px);
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 22px;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .active-number {
            color: #22c55e !important;
        }

        .expired-number {
            color: #f59e0b !important;
        }

        .cancelled-number {
            color: #ef4444 !important;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
        }

        .search-box input,
        .controls select {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #303030;
            color: white;
            padding: 11px 13px;
            border-radius: 7px;
            outline: none;
        }

        .search-box input:focus,
        .controls select:focus {
            border-color: #ff4d00;
        }

        .filter-box {
            width: 180px;
        }

        .refresh-btn {
            border: 1px solid #333;
            background: #242424;
            color: white;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #333;
        }

        /* =========================
           TABLE
        ========================= */

        .table-container {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #292929;
            font-size: 13px;
        }

        th {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            color: #ddd;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .status-expired {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .view-btn {
            border: 1px solid #444;
            background: #242424;
            color: white;
            padding: 7px 11px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .view-btn:hover {
            background: #333;
        }

        .empty-state {
            text-align: center;
            padding: 45px;
            color: #777;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 520px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 25px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: white;
        }

        .modal-body {
            padding: 20px;
        }

        /* =========================
           CREATE FORM
        ========================= */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            background: #0b0b0b;
            border: 1px solid #303030;
            color: white;
            padding: 12px 14px;
            border-radius: 7px;
            outline: none;
        }

        .form-control:focus {
            border-color: #ff4d00;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-form-btn {
            border: 1px solid #444;
            background: #242424;
            color: white;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-form-btn {
            border: none;
            background: #ff4d00;
            color: white;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-form-btn:hover {
            background: #ff6a2a;
        }

        .submit-form-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           DETAILS
        ========================= */

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #292929;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
        }

        .detail-value {
            color: white;
            text-align: right;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #242424;
            border: 1px solid #444;
            color: white;
            padding: 13px 18px;
            border-radius: 7px;
            display: none;
            z-index: 2000;
            font-size: 13px;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: #22c55e;
        }

        .toast.error {
            border-color: #ef4444;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            header {
                padding: 0 18px;
            }

            .admin-badge {
                display: none;
            }

            .container {
                width: 94%;
            }

            .page-title {
                align-items: flex-start;
            }

            .create-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .filter-box {
                width: 100%;
            }

            .form-actions {
                flex-direction: column;
            }

            .cancel-form-btn,
            .submit-form-btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            IRONFORGE
        </div>

        <div class="admin-area">

            <div class="admin-badge">
                ADMIN PANEL
            </div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

        <!-- PAGE TITLE -->

        <div class="page-title">

            <div>

                <h1>
                    Membership Management
                </h1>

                <p>
                    Manage customer memberships,
                    plans and membership status.
                </p>

            </div>

            <button
                class="create-btn"
                onclick="openCreateMembershipModal()"
            >
                + Create Membership
            </button>

        </div>


        <!-- =========================
             STATS
        ========================= -->

        <div class="stats">

            <div class="stat-card">

                <h3>
                    TOTAL MEMBERSHIPS
                </h3>

                <div
                    class="number"
                    id="totalMemberships"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    ACTIVE
                </h3>

                <div
                    class="number active-number"
                    id="activeMemberships"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    EXPIRED
                </h3>

                <div
                    class="number expired-number"
                    id="expiredMemberships"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    CANCELLED
                </h3>

                <div
                    class="number cancelled-number"
                    id="cancelledMemberships"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             CONTROLS
        ========================= -->

        <div class="controls">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search member, email or plan..."
                    oninput="filterMemberships()"
                >

            </div>


            <div class="filter-box">

                <select
                    id="statusFilter"
                    onchange="filterMemberships()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="expired">
                        Expired
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                </select>

            </div>


            <button
                class="refresh-btn"
                onclick="loadMemberships()"
            >
                Refresh
            </button>

        </div>


        <!-- =========================
             TABLE
        ========================= -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Member
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Plan
                        </th>

                        <th>
                            Start Date
                        </th>

                        <th>
                            Expiry Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="membershipTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="empty-state"
                        >
                            Loading memberships...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         CREATE MEMBERSHIP MODAL
    ========================= -->

    <div
        id="createMembershipModal"
        class="modal-overlay"
        onclick="closeCreateModalOutside(event)"
    >

        <div class="modal">

            <div class="modal-header">

                <h2>
                    Create Membership
                </h2>

                <button
                    class="close-btn"
                    onclick="closeCreateMembershipModal()"
                >
                    ×
                </button>

            </div>


            <div class="modal-body">

                <form
                    id="createMembershipForm"
                    onsubmit="createMembership(event)"
                >

                    <div class="form-group">

                        <label for="membershipUser">
                            Customer
                        </label>

                        <select
                            id="membershipUser"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Loading customers...
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="membershipPlan">
                            Plan
                        </label>

                        <select
                            id="membershipPlan"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Loading plans...
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="membershipStartDate">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="membershipStartDate"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            class="cancel-form-btn"
                            onclick="closeCreateMembershipModal()"
                        >
                            Cancel
                        </button>

                        <button
                            type="submit"
                            id="createMembershipBtn"
                            class="submit-form-btn"
                        >
                            Create Membership
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- =========================
         DETAILS MODAL
    ========================= -->

    <div
        id="detailsModal"
        class="modal-overlay"
        onclick="closeDetailsModalOutside(event)"
    >

        <div class="modal">

            <div class="modal-header">

                <h2>
                    Membership Details
                </h2>

                <button
                    class="close-btn"
                    onclick="closeDetailsModal()"
                >
                    ×
                </button>

            </div>


            <div
                class="modal-body"
                id="detailsContent"
            >

                Loading...

            </div>

        </div>

    </div>


    <!-- =========================
         TOAST
    ========================= -->

    <div
        id="toast"
        class="toast"
    >
    </div>


    <script>

        // ==========================================
        // API CONFIG
        // ==========================================

        const API_BASE_URL =
            "http://127.0.0.1:5000/api";


        let allMemberships = [];


        // ==========================================
        // AUTH
        // ==========================================

        function getToken() {

            return localStorage.getItem(
                "ironforgeToken"
            );
        }


        function getUser() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "ironforgeUser"
                    )
                );

            } catch (error) {

                return null;
            }
        }


        function checkAdmin() {

            const token = getToken();
            const user = getUser();

            if (!token || !user) {

                window.location.href =
                    "disicipline.html";

                return false;
            }

            if (user.role !== "admin") {

                alert(
                    "Admin access required."
                );

                window.location.href =
                    "disicipline.html";

                return false;
            }

            return true;
        }


        function logout() {

            localStorage.removeItem(
                "ironforgeToken"
            );

            localStorage.removeItem(
                "ironforgeUser"
            );

            window.location.href =
                "disicipline.html";
        }


        // ==========================================
        // TOAST
        // ==========================================

        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById(
                    "toast"
                );

            toast.textContent = message;

            toast.className =
                `toast show ${type}`;

            setTimeout(() => {

                toast.className =
                    "toast";

            }, 3000);
        }


        // ==========================================
        // LOAD MEMBERSHIPS
        // ==========================================

        async function loadMemberships() {

            if (!checkAdmin()) {
                return;
            }

            const tbody =
                document.getElementById(
                    "membershipTableBody"
                );

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        class="empty-state"
                    >
                        Loading memberships...
                    </td>
                </tr>
            `;


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/admin/memberships`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${getToken()}`,

                                "Content-Type":
                                    "application/json"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load memberships"
                    );
                }


                allMemberships =
                    data.memberships ||
                    data ||
                    [];


                updateStats();

                filterMemberships();


            } catch (error) {

                console.error(
                    "Load memberships error:",
                    error
                );

                tbody.innerHTML = `
                    <tr>
                        <td
                            colspan="7"
                            class="empty-state"
                        >
                            Failed to load memberships.
                        </td>
                    </tr>
                `;

                showToast(
                    error.message ||
                    "Failed to load memberships",
                    "error"
                );
            }
        }


        // ==========================================
        // UPDATE STATS
        // ==========================================

        function updateStats() {

            const total =
                allMemberships.length;

            const active =
                allMemberships.filter(
                    membership =>
                        getMembershipStatus(
                            membership
                        ) === "active"
                ).length;


            const expired =
                allMemberships.filter(
                    membership =>
                        getMembershipStatus(
                            membership
                        ) === "expired"
                ).length;


            const cancelled =
                allMemberships.filter(
                    membership =>
                        getMembershipStatus(
                            membership
                        ) === "cancelled"
                ).length;


            document.getElementById(
                "totalMemberships"
            ).textContent = total;


            document.getElementById(
                "activeMemberships"
            ).textContent = active;


            document.getElementById(
                "expiredMemberships"
            ).textContent = expired;


            document.getElementById(
                "cancelledMemberships"
            ).textContent = cancelled;
        }


        // ==========================================
        // GET STATUS
        // ==========================================

        function getMembershipStatus(
            membership
        ) {

            if (
                membership.displayStatus
            ) {

                return membership.displayStatus
                    .toLowerCase();
            }


            return (
                membership.status ||
                "unknown"
            ).toLowerCase();
        }


        // ==========================================
        // FILTER
        // ==========================================

        function filterMemberships() {

            const search =
                document.getElementById(
                    "searchInput"
                ).value
                .toLowerCase()
                .trim();


            const status =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                allMemberships.filter(
                    membership => {

                        const user =
                            membership.user &&
                            typeof membership.user === "object"
                                ? membership.user
                                : {};


                        const planObject =
                            membership.planId &&
                            typeof membership.planId === "object"
                                ? membership.planId
                                : {};


                        const name =
                            user.name ||
                            membership.name ||
                            "";


                        const email =
                            user.email ||
                            membership.email ||
                            "";


                        const plan =
                            planObject.name ||
                            membership.plan ||
                            "";


                        const currentStatus =
                            getMembershipStatus(
                                membership
                            );


                        const matchesSearch =
                            !search ||
                            name.toLowerCase().includes(search) ||
                            email.toLowerCase().includes(search) ||
                            plan.toLowerCase().includes(search);


                        const matchesStatus =
                            status === "all" ||
                            currentStatus === status;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );
                    }
                );


            renderMemberships(filtered);
        }


        // ==========================================
        // RENDER MEMBERSHIPS
        // ==========================================

        function renderMemberships(
            memberships
        ) {

            const tbody =
                document.getElementById(
                    "membershipTableBody"
                );


            if (
                !memberships ||
                memberships.length === 0
            ) {

                tbody.innerHTML = `
                    <tr>
                        <td
                            colspan="7"
                            class="empty-state"
                        >
                            No memberships found.
                        </td>
                    </tr>
                `;

                return;
            }


            tbody.innerHTML =
                memberships.map(
                    membership => {

                        const user =
                            membership.user &&
                            typeof membership.user === "object"
                                ? membership.user
                                : {};


                        const planObject =
                            membership.planId &&
                            typeof membership.planId === "object"
                                ? membership.planId
                                : {};


                        const name =
                            user.name ||
                            membership.name ||
                            "Unknown";


                        const email =
                            user.email ||
                            membership.email ||
                            "-";


                        const plan =
                            planObject.name ||
                            membership.plan ||
                            "-";


                        const startDate =
                            formatDate(
                                membership.startDate
                            );


                        const expiryDate =
                            formatDate(
                                membership.expiryDate
                            );


                        const status =
                            getMembershipStatus(
                                membership
                            );


                        const statusClass =
                            status === "active"
                                ? "status-active"
                                : status === "expired"
                                    ? "status-expired"
                                    : "status-cancelled";


                        const membershipId =
                            membership._id ||
                            membership.id ||
                            membership.membershipId;


                        return `

                            <tr>

                                <td>
                                    ${escapeHtml(name)}
                                </td>

                                <td>
                                    ${escapeHtml(email)}
                                </td>

                                <td>
                                    ${escapeHtml(plan)}
                                </td>

                                <td>
                                    ${startDate}
                                </td>

                                <td>
                                    ${expiryDate}
                                </td>

                                <td>

                                    <span
                                        class="status ${statusClass}"
                                    >
                                        ${escapeHtml(
                                            capitalize(status)
                                        )}
                                    </span>

                                </td>

                                <td>

                                    <button
                                        class="view-btn"
                                        onclick="viewMembership('${escapeHtml(
                                            membershipId || ""
                                        )}')"
                                    >
                                        View Details
                                    </button>

                                </td>

                            </tr>

                        `;
                    }
                ).join("");
        }


        // ==========================================
        // VIEW DETAILS
        // ==========================================

        function viewMembership(
            membershipId
        ) {

            const membership =
                allMemberships.find(
                    item =>
                        (
                            item._id ||
                            item.id ||
                            item.membershipId
                        ) === membershipId
                );


            if (!membership) {

                showToast(
                    "Membership not found",
                    "error"
                );

                return;
            }


            const user =
                membership.user &&
                typeof membership.user === "object"
                    ? membership.user
                    : {};


            const planObject =
                membership.planId &&
                typeof membership.planId === "object"
                    ? membership.planId
                    : {};


            const name =
                user.name ||
                membership.name ||
                "Unknown";


            const email =
                user.email ||
                membership.email ||
                "-";


            const plan =
                planObject.name ||
                membership.plan ||
                "-";


            const price =
                planObject.price ??
                "-";


            const duration =
                planObject.duration ??
                "-";


            const status =
                getMembershipStatus(
                    membership
                );


            document.getElementById(
                "detailsContent"
            ).innerHTML = `

                <div class="detail-row">

                    <span class="detail-label">
                        Member Name
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(name)}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Email
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(email)}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Plan
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(plan)}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Price
                    </span>

                    <span class="detail-value">
                        ₹${escapeHtml(String(price))}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Duration
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(String(duration))} days
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Status
                    </span>

                    <span class="detail-value">
                        ${escapeHtml(
                            capitalize(status)
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Start Date
                    </span>

                    <span class="detail-value">
                        ${formatDate(
                            membership.startDate
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        Expiry Date
                    </span>

                    <span class="detail-value">
                        ${formatDate(
                            membership.expiryDate
                        )}
                    </span>

                </div>

            `;


            document
                .getElementById(
                    "detailsModal"
                )
                .classList.add("show");
        }


        function closeDetailsModal() {

            document
                .getElementById(
                    "detailsModal"
                )
                .classList.remove("show");
        }


        function closeDetailsModalOutside(
            event
        ) {

            if (
                event.target.id ===
                "detailsModal"
            ) {

                closeDetailsModal();
            }
        }


        // ==========================================
        // CREATE MEMBERSHIP MODAL
        // ==========================================

        async function openCreateMembershipModal() {

            if (!checkAdmin()) {
                return;
            }


            const modal =
                document.getElementById(
                    "createMembershipModal"
                );


            modal.classList.add("show");


            document
                .getElementById(
                    "createMembershipForm"
                )
                .reset();


            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            document.getElementById(
                "membershipStartDate"
            ).value = today;


            await Promise.all([
                loadCustomersForMembership(),
                loadPlansForMembership()
            ]);
        }


        // ==========================================
        // LOAD CUSTOMERS
        // ==========================================

        async function loadCustomersForMembership() {

            const select =
                document.getElementById(
                    "membershipUser"
                );


            select.innerHTML = `
                <option value="">
                    Loading customers...
                </option>
            `;


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/admin/members`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${getToken()}`,

                                "Content-Type":
                                    "application/json"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load customers"
                    );
                }


                const members =
                    data.members ||
                    data.users ||
                    data;


                if (
                    !Array.isArray(members) ||
                    members.length === 0
                ) {

                    select.innerHTML = `
                        <option value="">
                            No customers found
                        </option>
                    `;

                    return;
                }


                select.innerHTML = `
                    <option value="">
                        Select customer
                    </option>
                `;


                members.forEach(
                    member => {

                        const user =
                            member.user &&
                            typeof member.user === "object"
                                ? member.user
                                : member;


                        const userId =
                            user._id ||
                            user.id ||
                            user.userId ||
                            member.userId;


                        const name =
                            user.name ||
                            member.name ||
                            "Unknown Customer";


                        const email =
                            user.email ||
                            member.email ||
                            "";


                        if (userId) {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                userId;


                            option.textContent =
                                email
                                    ? `${name} (${email})`
                                    : name;


                            select.appendChild(
                                option
                            );
                        }
                    }
                );


            } catch (error) {

                console.error(
                    "Load customers error:",
                    error
                );


                select.innerHTML = `
                    <option value="">
                        Failed to load customers
                    </option>
                `;


                showToast(
                    error.message ||
                    "Failed to load customers",
                    "error"
                );
            }
        }


        // ==========================================
        // LOAD PLANS
        // ==========================================

        async function loadPlansForMembership() {

            const select =
                document.getElementById(
                    "membershipPlan"
                );


            select.innerHTML = `
                <option value="">
                    Loading plans...
                </option>
            `;


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/plans`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${getToken()}`,

                                "Content-Type":
                                    "application/json"
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load plans"
                    );
                }


                const plans =
                    data.plans ||
                    data;


                if (
                    !Array.isArray(plans) ||
                    plans.length === 0
                ) {

                    select.innerHTML = `
                        <option value="">
                            No active plans found
                        </option>
                    `;

                    return;
                }


                select.innerHTML = `
                    <option value="">
                        Select plan
                    </option>
                `;


                plans.forEach(
                    plan => {

                        if (
                            plan.active === false
                        ) {
                            return;
                        }


                        const planId =
                            plan._id ||
                            plan.id ||
                            plan.planId;


                        if (!planId) {
                            return;
                        }


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            planId;


                        option.textContent =
                            `${plan.name || "Plan"} - ₹${plan.price ?? "-"} / ${plan.duration ?? "-"} days`;


                        select.appendChild(
                            option
                        );
                    }
                );


            } catch (error) {

                console.error(
                    "Load plans error:",
                    error
                );


                select.innerHTML = `
                    <option value="">
                        Failed to load plans
                    </option>
                `;


                showToast(
                    error.message ||
                    "Failed to load plans",
                    "error"
                );
            }
        }


        // ==========================================
        // CREATE MEMBERSHIP
        // ==========================================

        async function createMembership(
            event
        ) {

            event.preventDefault();


            const userId =
                document.getElementById(
                    "membershipUser"
                ).value;


            const planId =
                document.getElementById(
                    "membershipPlan"
                ).value;


            const startDate =
                document.getElementById(
                    "membershipStartDate"
                ).value;


            if (
                !userId ||
                !planId ||
                !startDate
            ) {

                showToast(
                    "Please fill all fields",
                    "error"
                );

                return;
            }


            const button =
                document.getElementById(
                    "createMembershipBtn"
                );


            button.disabled = true;

            button.textContent =
                "Creating...";


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/membership`,
                        {
                            method: "POST",

                            headers: {
                                "Authorization":
                                    `Bearer ${getToken()}`,

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                userId,
                                planId,
                                startDate
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to create membership"
                    );
                }


                showToast(
                    "Membership created successfully! ✅",
                    "success"
                );


                closeCreateMembershipModal();


                await loadMemberships();


            } catch (error) {

                console.error(
                    "Create membership error:",
                    error
                );


                showToast(
                    error.message ||
                    "Failed to create membership",
                    "error"
                );


            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Membership";
            }
        }


        // ==========================================
        // CLOSE CREATE MODAL
        // ==========================================

        function closeCreateMembershipModal() {

            document
                .getElementById(
                    "createMembershipModal"
                )
                .classList.remove("show");
        }


        function closeCreateModalOutside(
            event
        ) {

            if (
                event.target.id ===
                "createMembershipModal"
            ) {

                closeCreateMembershipModal();
            }
        }


        // ==========================================
        // HELPERS
        // ==========================================

        function formatDate(
            date
        ) {

            if (!date) {
                return "-";
            }


            const parsed =
                new Date(date);


            if (
                Number.isNaN(
                    parsed.getTime()
                )
            ) {

                return "-";
            }


            return parsed.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );
        }


        function capitalize(
            value
        ) {

            if (!value) {
                return "";
            }


            return (
                value.charAt(0).toUpperCase() +
                value.slice(1)
            );
        }


        function escapeHtml(
            value
        ) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        // ==========================================
        // PAGE LOAD
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                if (checkAdmin()) {

                    loadMemberships();
                }

            }
        );

    </script>
