<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IronForge - Membership Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 75px;
            background: #0d0d0d;
            border-bottom: 1px solid #242424;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff5a00;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-badge {
            background: rgba(255, 90, 0, 0.12);
            border: 1px solid rgba(255, 90, 0, 0.35);
            color: #ff6a00;

            padding: 8px 13px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .logout-btn {
            border: 1px solid #333;
            background: #151515;
            color: #fff;

            padding: 9px 14px;
            border-radius: 8px;

            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            border-color: #ff5a00;
            color: #ff5a00;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            padding: 35px;
            max-width: 1500px;
            margin: auto;
        }

        .page-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 30px;
        }

        .page-title small {
            color: #777;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-top: 6px;
            font-weight: 900;
        }

        .page-title h1 span {
            color: #ff5a00;
        }

        /* =========================
           CREATE BUTTON
        ========================= */

        .create-btn {
            background: #ff5a00;
            color: #fff;

            border: none;
            padding: 13px 20px;

            border-radius: 9px;

            font-weight: 800;
            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 9px;

            transition: 0.2s;
        }

        .create-btn:hover {
            background: #ff6a19;
            transform: translateY(-1px);
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: #101010;
            border: 1px solid #242424;

            padding: 22px;
            border-radius: 12px;
        }

        .stat-card p {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .stat-card i {
            color: #ff5a00;
            margin-right: 8px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;
            gap: 12px;

            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            color: #666;
        }

        .search-box input,
        .filter-select {
            width: 100%;

            background: #101010;
            border: 1px solid #292929;

            color: #fff;

            padding: 13px 14px;
            border-radius: 8px;

            outline: none;
        }

        .search-box input {
            padding-left: 40px;
        }

        .search-box input:focus,
        .filter-select:focus {
            border-color: #ff5a00;
        }

        .refresh-btn {
            background: #151515;
            border: 1px solid #292929;
            color: #fff;

            padding: 0 18px;
            border-radius: 8px;

            cursor: pointer;
        }

        .refresh-btn:hover {
            border-color: #ff5a00;
            color: #ff5a00;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            background: #101010;
            border: 1px solid #242424;

            border-radius: 12px;

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #222;
        }

        th {
            color: #777;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        td {
            font-size: 13px;
        }

        tbody tr:hover {
            background: #151515;
        }

        .member-name {
            font-weight: 700;
        }

        .member-email {
            color: #777;
            font-size: 11px;
            margin-top: 4px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 20px;

            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(0, 200, 100, 0.12);
            color: #25d987;
        }

        .status-expired {
            background: rgba(255, 180, 0, 0.12);
            color: #ffc400;
        }

        .status-cancelled {
            background: rgba(255, 50, 50, 0.12);
            color: #ff5555;
        }

        .status-expiring {
            background: rgba(255, 120, 0, 0.12);
            color: #ff8c00;
        }

        /* =========================
           VIEW BUTTON
        ========================= */

        .view-btn {
            background: transparent;
            border: 1px solid #333;

            color: #fff;

            padding: 8px 12px;
            border-radius: 7px;

            cursor: pointer;
        }

        .view-btn:hover {
            border-color: #ff5a00;
            color: #ff5a00;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.78);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 560px;

            background: #111;

            border: 1px solid #2c2c2c;
            border-radius: 14px;

            padding: 28px;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .modal-header h2 span {
            color: #ff5a00;
        }

        .close-btn {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            border: 1px solid #333;
            background: #181818;

            color: #fff;

            cursor: pointer;
        }

        .close-btn:hover {
            border-color: #ff5a00;
            color: #ff5a00;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            color: #aaa;
            font-size: 12px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            background: #090909;
            border: 1px solid #303030;

            color: #fff;

            padding: 13px;

            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff5a00;
        }

        .plan-info {
            display: none;

            margin-top: 10px;

            padding: 13px;

            background: rgba(255, 90, 0, 0.08);
            border: 1px solid rgba(255, 90, 0, 0.2);

            border-radius: 8px;

            font-size: 12px;
            color: #aaa;
        }

        .plan-info strong {
            color: #ff6a00;
        }

        .form-actions {
            display: flex;
            gap: 10px;

            margin-top: 25px;
        }

        .submit-btn {
            flex: 1;

            background: #ff5a00;
            color: #fff;

            border: none;

            padding: 13px;
            border-radius: 8px;

            font-weight: 800;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #ff6a19;
        }

        .cancel-btn {
            background: #191919;
            color: #fff;

            border: 1px solid #333;

            padding: 13px 20px;
            border-radius: 8px;

            cursor: pointer;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            text-align: center;
            padding: 55px 20px;

            color: #666;
        }

        .empty-state i {
            font-size: 35px;
            margin-bottom: 12px;
            color: #444;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            background: #171717;
            border: 1px solid #333;

            padding: 14px 18px;

            border-radius: 8px;

            display: none;

            z-index: 2000;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            border-color: #22c77a;
        }

        .toast.error {
            border-color: #ff4545;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-top {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .admin-badge {
                display: none;
            }

            main {
                padding: 22px 15px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .refresh-btn {
                padding: 12px;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        IRON<span>FORGE</span>
    </div>

    <div class="header-right">

        <span class="admin-badge">
            <i class="fa-solid fa-shield-halved"></i>
            ADMIN
        </span>

        <button class="logout-btn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <div class="page-top">

        <div class="page-title">

            <small>ADMIN CONTROL CENTER</small>

            <h1>
                Membership <span>Management</span>
            </h1>

        </div>

        <button class="create-btn" onclick="openCreateModal()">
            <i class="fa-solid fa-plus"></i>
            Create Membership
        </button>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <div class="stats-grid">

        <div class="stat-card">

            <p>
                <i class="fa-solid fa-id-card"></i>
                TOTAL MEMBERSHIPS
            </p>

            <h2 id="totalCount">0</h2>

        </div>


        <div class="stat-card">

            <p>
                <i class="fa-solid fa-circle-check"></i>
                ACTIVE
            </p>

            <h2 id="activeCount">0</h2>

        </div>


        <div class="stat-card">

            <p>
                <i class="fa-solid fa-clock"></i>
                EXPIRED
            </p>

            <h2 id="expiredCount">0</h2>

        </div>


        <div class="stat-card">

            <p>
                <i class="fa-solid fa-ban"></i>
                CANCELLED
            </p>

            <h2 id="cancelledCount">0</h2>

        </div>

    </div>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="controls">

        <div class="search-box">

            <i class="fa-solid fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search member, email or plan..."
                oninput="applyFilters()"
            >

        </div>


        <select
            id="statusFilter"
            class="filter-select"
            onchange="applyFilters()"
        >

            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="expired">Expired</option>
            <option value="cancelled">Cancelled</option>

        </select>


        <button
            class="refresh-btn"
            onclick="loadMemberships()"
            title="Refresh"
        >

            <i class="fa-solid fa-rotate"></i>

        </button>

    </div>


    <!-- =========================
         TABLE
    ========================= -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Member</th>
                    <th>Plan</th>
                    <th>Price</th>
                    <th>Start Date</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="membershipTable">

            </tbody>

        </table>

    </div>

</main>


<!-- =====================================================
     CREATE MEMBERSHIP MODAL
===================================================== -->

<div class="modal" id="createModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Create <span>Membership</span>
            </h2>

            <button
                class="close-btn"
                onclick="closeCreateModal()"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="createMembershipForm">


            <!-- MEMBER -->

            <div class="form-group">

                <label>
                    Select Member
                </label>

                <select
                    id="memberSelect"
                    required
                >

                    <option value="">
                        Loading members...
                    </option>

                </select>

            </div>


            <!-- PLAN -->

            <div class="form-group">

                <label>
                    Select Plan
                </label>

                <select
                    id="planSelect"
                    onchange="handlePlanChange()"
                    required
                >

                    <option value="">
                        Loading plans...
                    </option>

                </select>


                <div
                    class="plan-info"
                    id="planInfo"
                >

                    <div>
                        Price:
                        <strong id="planPrice">₹0</strong>
                    </div>

                    <div style="margin-top:5px;">
                        Duration:
                        <strong id="planDuration">0 days</strong>
                    </div>

                </div>

            </div>


            <!-- START DATE -->

            <div class="form-group">

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    id="startDate"
                    required
                    onchange="calculateExpiryDate()"
                >

            </div>


            <!-- EXPIRY DATE -->

            <div class="form-group">

                <label>
                    Expiry Date
                </label>

                <input
                    type="date"
                    id="expiryDate"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeCreateModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    <i class="fa-solid fa-check"></i>
                    Create Membership
                </button>

            </div>


        </form>

    </div>

</div>


<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div class="modal" id="detailsModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Membership <span>Details</span>
            </h2>

            <button
                class="close-btn"
                onclick="closeDetailsModal()"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div id="detailsContent"></div>

    </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API_BASE_URL =
        "http://127.0.0.1:5000/api";


    let memberships = [];
    let members = [];
    let plans = [];


    /* =====================================================
       AUTH
    ===================================================== */

    const token =
        localStorage.getItem("ironforgeToken");

    const loggedUser =
        JSON.parse(
            localStorage.getItem("ironforgeUser") || "null"
        );


    if (!token || !loggedUser || loggedUser.role !== "admin") {

        window.location.href =
            "disicipline.html";

    }


    /* =====================================================
       API HELPER
    ===================================================== */

    async function apiRequest(
        url,
        options = {}
    ) {

        const response =
            await fetch(
                API_BASE_URL + url,
                {
                    ...options,

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`,

                        ...(options.headers || {})
                    }
                }
            );


        const data =
            await response.json()
                .catch(() => ({}));


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Something went wrong"
            );

        }


        return data;

    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            setDefaultStartDate();

            await loadMemberships();

        }
    );


    /* =====================================================
       LOAD MEMBERSHIPS
    ===================================================== */

    async function loadMemberships() {

        try {

            const data =
                await apiRequest(
                    "/admin/memberships"
                );


            memberships =
                data.memberships ||
                data ||
                [];


            updateStats();

            applyFilters();

        } catch (error) {

            console.error(error);

            showToast(
                error.message,
                "error"
            );

        }

    }


    /* =====================================================
       LOAD MEMBERS
    ===================================================== */

    async function loadMembers() {

        try {

            const data =
                await apiRequest(
                    "/admin/members"
                );


            members =
                data.members ||
                data.users ||
                data ||
                [];


            populateMemberSelect();

        } catch (error) {

            console.error(
                "Members loading error:",
                error
            );

            document.getElementById(
                "memberSelect"
            ).innerHTML = `
                <option value="">
                    Unable to load members
                </option>
            `;

        }

    }


    /* =====================================================
       LOAD PLANS
    ===================================================== */

    async function loadPlans() {

        try {

            const data =
                await apiRequest(
                    "/plans"
                );


            plans =
                data.plans ||
                [];


            populatePlanSelect();

        } catch (error) {

            console.error(
                "Plans loading error:",
                error
            );

            document.getElementById(
                "planSelect"
            ).innerHTML = `
                <option value="">
                    Unable to load plans
                </option>
            `;

        }

    }


    /* =====================================================
       POPULATE MEMBER SELECT
    ===================================================== */

    function populateMemberSelect() {

        const select =
            document.getElementById(
                "memberSelect"
            );


        if (!members.length) {

            select.innerHTML = `
                <option value="">
                    No members found
                </option>
            `;

            return;

        }


        select.innerHTML = `
            <option value="">
                Select a member
            </option>
        `;


        members.forEach(member => {

            const memberId =
                member.userId ||
                member._id ||
                member.id;


            if (!memberId) return;


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                memberId;


            option.textContent =
                `${member.name || "Unknown"} — ${member.email || ""}`;


            select.appendChild(option);

        });

    }


    /* =====================================================
       POPULATE PLAN SELECT
    ===================================================== */

    function populatePlanSelect() {

        const select =
            document.getElementById(
                "planSelect"
            );


        if (!plans.length) {

            select.innerHTML = `
                <option value="">
                    No active plans found
                </option>
            `;

            return;

        }


        select.innerHTML = `
            <option value="">
                Select a plan
            </option>
        `;


        plans.forEach(plan => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                plan._id ||
                plan.id;


            option.textContent =
                `${plan.name} — ₹${plan.price} / ${plan.duration} days`;


            option.dataset.price =
                plan.price;


            option.dataset.duration =
                plan.duration;


            option.dataset.name =
                plan.name;


            select.appendChild(option);

        });

    }


    /* =====================================================
       CREATE MODAL
    ===================================================== */

    async function openCreateModal() {

        document
            .getElementById("createModal")
            .classList.add("show");


        await Promise.all([
            loadMembers(),
            loadPlans()
        ]);


        setDefaultStartDate();

        handlePlanChange();

    }


    function closeCreateModal() {

        document
            .getElementById("createModal")
            .classList.remove("show");


        document
            .getElementById(
                "createMembershipForm"
            )
            .reset();


        document
            .getElementById(
                "planInfo"
            )
            .style.display = "none";

    }


    /* =====================================================
       PLAN CHANGE
    ===================================================== */

    function handlePlanChange() {

        const select =
            document.getElementById(
                "planSelect"
            );


        const selectedOption =
            select.options[
                select.selectedIndex
            ];


        if (
            !selectedOption ||
            !selectedOption.value
        ) {

            document
                .getElementById("planInfo")
                .style.display = "none";

            return;

        }


        const price =
            selectedOption.dataset.price;

        const duration =
            selectedOption.dataset.duration;


        document.getElementById(
            "planPrice"
        ).textContent =
            `₹${price}`;


        document.getElementById(
            "planDuration"
        ).textContent =
            `${duration} days`;


        document
            .getElementById("planInfo")
            .style.display = "block";


        calculateExpiryDate();

    }


    /* =====================================================
       DEFAULT START DATE
    ===================================================== */

    function setDefaultStartDate() {

        const input =
            document.getElementById(
                "startDate"
            );


        const today =
            new Date();


        const yyyy =
            today.getFullYear();


        const mm =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");


        const dd =
            String(
                today.getDate()
            ).padStart(2, "0");


        input.value =
            `${yyyy}-${mm}-${dd}`;


        calculateExpiryDate();

    }


    /* =====================================================
       CALCULATE EXPIRY
    ===================================================== */

    function calculateExpiryDate() {

        const startValue =
            document.getElementById(
                "startDate"
            ).value;


        const planSelect =
            document.getElementById(
                "planSelect"
            );


        if (
            !startValue ||
            !planSelect.value
        ) return;


        const selectedOption =
            planSelect.options[
                planSelect.selectedIndex
            ];


        const duration =
            parseInt(
                selectedOption.dataset.duration
            );


        if (!duration) return;


        const date =
            new Date(
                startValue + "T00:00:00"
            );


        /*
            Example:

            Start = 29 Oct
            Duration = 30 days

            Expiry = 28 Nov

            So we subtract 1 day from
            start + duration.
        */

        date.setDate(
            date.getDate() +
            duration -
            1
        );


        const yyyy =
            date.getFullYear();


        const mm =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");


        const dd =
            String(
                date.getDate()
            ).padStart(2, "0");


        document.getElementById(
            "expiryDate"
        ).value =
            `${yyyy}-${mm}-${dd}`;

    }


    /* =====================================================
       CREATE MEMBERSHIP
    ===================================================== */

    document
        .getElementById(
            "createMembershipForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const userId =
                    document.getElementById(
                        "memberSelect"
                    ).value;


                const planSelect =
                    document.getElementById(
                        "planSelect"
                    );


                const selectedPlan =
                    planSelect.options[
                        planSelect.selectedIndex
                    ];


                const startDate =
                    document.getElementById(
                        "startDate"
                    ).value;


                const expiryDate =
                    document.getElementById(
                        "expiryDate"
                    ).value;


                if (
                    !userId ||
                    !selectedPlan.value ||
                    !startDate ||
                    !expiryDate
                ) {

                    showToast(
                        "Please fill all fields",
                        "error"
                    );

                    return;

                }


                const planName =
                    selectedPlan.dataset.name;


                try {

                    const data =
                        await apiRequest(
                            "/membership",
                            {
                                method: "POST",

                                body: JSON.stringify({

                                    userId,

                                    plan:
                                        planName,

                                    startDate,

                                    expiryDate

                                })
                            }
                        );


                    showToast(
                        data.message ||
                        "Membership created successfully",
                        "success"
                    );


                    closeCreateModal();


                    await loadMemberships();


                } catch (error) {

                    console.error(error);

                    showToast(
                        error.message,
                        "error"
                    );

                }

            }
        );


    /* =====================================================
       STATS
    ===================================================== */

    function updateStats() {

        let active = 0;
        let expired = 0;
        let cancelled = 0;


        memberships.forEach(
            membership => {

                const status =
                    getMembershipStatus(
                        membership
                    );


                if (status === "active")
                    active++;


                if (status === "expired")
                    expired++;


                if (status === "cancelled")
                    cancelled++;

            }
        );


        document.getElementById(
            "totalCount"
        ).textContent =
            memberships.length;


        document.getElementById(
            "activeCount"
        ).textContent =
            active;


        document.getElementById(
            "expiredCount"
        ).textContent =
            expired;


        document.getElementById(
            "cancelledCount"
        ).textContent =
            cancelled;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function getMembershipStatus(
        membership
    ) {

        if (
            membership.status ===
            "cancelled"
        ) {

            return "cancelled";

        }


        const expiry =
            new Date(
                membership.expiryDate
            );


        if (
            !isNaN(expiry.getTime()) &&
            new Date() >= expiry
        ) {

            return "expired";

        }


        return "active";

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function applyFilters() {

        const search =
            document.getElementById(
                "searchInput"
            ).value
            .toLowerCase()
            .trim();


        const statusFilter =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            memberships.filter(
                membership => {

                    const user =
                        membership.user || {};


                    const plan =
                        membership.planId || {};


                    const name =
                        user.name ||
                        "";


                    const email =
                        user.email ||
                        "";


                    const planName =
                        plan.name ||
                        membership.plan ||
                        "";


                    const matchesSearch =
                        name
                            .toLowerCase()
                            .includes(search) ||

                        email
                            .toLowerCase()
                            .includes(search) ||

                        planName
                            .toLowerCase()
                            .includes(search);


                    const status =
                        getMembershipStatus(
                            membership
                        );


                    const matchesStatus =
                        statusFilter === "all" ||
                        status === statusFilter;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            );


        renderMemberships(
            filtered
        );

    }


    /* =====================================================
       RENDER TABLE
    ===================================================== */

    function renderMemberships(
        list
    ) {

        const tbody =
            document.getElementById(
                "membershipTable"
            );


        if (!list.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="empty-state">
                            <i class="fa-solid fa-id-card"></i>
                            <div>No memberships found</div>
                        </div>
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML =
            list.map(
                membership => {

                    const user =
                        membership.user ||
                        {};


                    const plan =
                        membership.planId ||
                        {};


                    const memberName =
                        user.name ||
                        "Unknown Member";


                    const email =
                        user.email ||
                        "-";


                    const planName =
                        plan.name ||
                        membership.plan ||
                        "-";


                    const price =
                        plan.price !== undefined
                            ? `₹${plan.price}`
                            : "-";


                    const status =
                        getMembershipStatus(
                            membership
                        );


                    const statusClass =
                        status === "active"
                            ? "status-active"
                            : status === "expired"
                                ? "status-expired"
                                : "status-cancelled";


                    const startDate =
                        formatDate(
                            membership.startDate
                        );


                    const expiryDate =
                        formatDate(
                            membership.expiryDate
                        );


                    const membershipId =
                        membership._id ||
                        membership.id ||
                        membership.membershipId;


                    return `

                        <tr>

                            <td>

                                <div class="member-name">
                                    ${escapeHtml(memberName)}
                                </div>

                                <div class="member-email">
                                    ${escapeHtml(email)}
                                </div>

                            </td>


                            <td>
                                ${escapeHtml(planName)}
                            </td>


                            <td>
                                ${price}
                            </td>


                            <td>
                                ${startDate}
                            </td>


                            <td>
                                ${expiryDate}
                            </td>


                            <td>

                                <span
                                    class="status ${statusClass}"
                                >
                                    ${status}
                                </span>

                            </td>


                            <td>

                                <button
                                    class="view-btn"
                                    onclick="viewMembership('${membershipId}')"
                                >
                                    <i class="fa-solid fa-eye"></i>
                                    View
                                </button>

                            </td>

                        </tr>

                    `;

                }
            ).join("");

    }


    /* =====================================================
       VIEW DETAILS
    ===================================================== */

    function viewMembership(
        membershipId
    ) {

        const membership =
            memberships.find(
                item =>
                    String(
                        item._id ||
                        item.id ||
                        item.membershipId
                    ) ===
                    String(membershipId)
            );


        if (!membership) {

            showToast(
                "Membership not found",
                "error"
            );

            return;

        }


        const user =
            membership.user ||
            {};


        const plan =
            membership.planId ||
            {};


        const status =
            getMembershipStatus(
                membership
            );


        document.getElementById(
            "detailsContent"
        ).innerHTML = `

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:18px;
            ">

                <div>
                    <small style="color:#777;">
                        Member Name
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${escapeHtml(
                            user.name || "-"
                        )}
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Email
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${escapeHtml(
                            user.email || "-"
                        )}
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Plan
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${escapeHtml(
                            plan.name ||
                            membership.plan ||
                            "-"
                        )}
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Price
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${
                            plan.price !== undefined
                                ? `₹${plan.price}`
                                : "-"
                        }
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Duration
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${
                            plan.duration
                                ? `${plan.duration} days`
                                : "-"
                        }
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Status
                    </small>

                    <div style="margin-top:7px;">

                        <span
                            class="status ${
                                status === "active"
                                    ? "status-active"
                                    : status === "expired"
                                        ? "status-expired"
                                        : "status-cancelled"
                            }"
                        >
                            ${status}
                        </span>

                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Start Date
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${formatDate(
                            membership.startDate
                        )}
                    </div>
                </div>


                <div>
                    <small style="color:#777;">
                        Expiry Date
                    </small>

                    <div style="
                        margin-top:5px;
                        font-weight:700;
                    ">
                        ${formatDate(
                            membership.expiryDate
                        )}
                    </div>
                </div>

            </div>

        `;


        document
            .getElementById(
                "detailsModal"
            )
            .classList.add("show");

    }


    function closeDetailsModal() {

        document
            .getElementById(
                "detailsModal"
            )
            .classList.remove("show");

    }


    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(
        value
    ) {

        if (!value)
            return "-";


        const date =
            new Date(value);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleDateString(
            "en-GB",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        message,
        type = "success"
    ) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.className =
            `toast show ${type}`;


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

        localStorage.removeItem(
            "ironforgeToken"
        );

        localStorage.removeItem(
            "ironforgeUser"
        );


        window.location.href =
            "disicipline.html";

    }


    /* =====================================================
       CLOSE MODAL WHEN CLICK OUTSIDE
    ===================================================== */

    window.addEventListener(
        "click",
        function(event) {

            const createModal =
                document.getElementById(
                    "createModal"
                );


            const detailsModal =
                document.getElementById(
                    "detailsModal"
                );


            if (
                event.target ===
                createModal
            ) {

                closeCreateModal();

            }


            if (
                event.target ===
                detailsModal
            ) {

                closeDetailsModal();

            }

        }
    );

</script>
